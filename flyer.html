<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Reba iyi nkuru kuri TURABIMENYE!">
    <meta property="og:description" content="Kanda urebe iyi nkuru y'amateka.">
    <meta property="og:type" content="article">
    <title>Flyer — TURABIMENYE!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .shared-wrap {
            max-width: 720px;
            margin: 60px auto 40px;
            padding: 0 var(--page-pad, 16px);
        }
        .shared-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .shared-header h1 {
            color: white;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 800;
            margin-bottom: 6px;
        }
        .shared-header p {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }
        .shared-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        .shared-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .shared-btn:hover { transform: translateY(-2px); }
        .shared-btn-primary { background: #f39c12; color: white; }
        .shared-btn-secondary { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.25); }
        .shared-btn-copy { background: #3498db; color: white; }
        .shared-error {
            background: rgba(255,255,255,0.96);
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            color: #555;
        }
        .shared-error h2 { color: #764ba2; margin-bottom: 10px; }

        /* Make the interaction buttons on the shared page clickable */
        .shared-wrap .interaction-btn {
            cursor: pointer;
            user-select: none;
        }
        .shared-wrap .interaction-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }
        /* ==================== SHARED PAGE — INTERACTION BAR ==================== */
        .shared-wrap .interaction-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 14px 0 6px;
            margin-top: 14px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }
        
        .shared-wrap .interaction-btn {
            display: inline-flex;
            flex-direction: row;          /* override column from main site */
            align-items: center;
            gap: 8px;
            background: #f4f0fa;
            color: #4b3b78;
            border: 1px solid rgba(91, 61, 138, 0.15);
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            min-width: 0;
            line-height: 1;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        
        .shared-wrap .interaction-btn:hover:not(:disabled) {
            background: #ece4f9;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(91, 61, 138, 0.15);
        }
        
        .shared-wrap .interaction-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .shared-wrap .interaction-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }
        
        /* Liked state — red */
        .shared-wrap .interaction-btn.liked,
        .shared-wrap .interaction-btn#btn-like[disabled] {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }
        
        /* Knew state — green */
        .shared-wrap .interaction-btn#btn-knew[disabled] {
            background: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }
        
        /* Didn't know state — orange */
        .shared-wrap .interaction-btn#btn-didntknow[disabled] {
            background: #e67e22;
            color: white;
            border-color: #e67e22;
        }
        
        /* Comment button is read-only on shared page */
        .shared-wrap .interaction-btn#btn-comments[disabled] {
            background: #f4f0fa;
            color: #4b3b78;
            opacity: 1;
        }
        
        .shared-wrap .interaction-btn span {
            font-weight: 800;
            font-size: 1rem;
        }
        
        /* Mobile tweak */
        @media (max-width: 480px) {
            .shared-wrap .interaction-btn {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            .shared-wrap .interaction-btn span {
                font-size: 0.9rem;
            }
        }

        /* Match the active class names used in the collection cards */
            .shared-wrap .interaction-btn.liked {
                background: #e74c3c !important;
                color: white !important;
                border-color: #e74c3c !important;
            }
            .shared-wrap .interaction-btn.knew-active {
                background: #2ecc71 !important;
                color: white !important;
                border-color: #2ecc71 !important;
            }
            .shared-wrap .interaction-btn.didntknow-active {
                background: #e67e22 !important;
                color: white !important;
                border-color: #e67e22 !important;
            }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="shared-wrap" id="sharedWrap">
            <div class="shared-header">
                <h1>📖 Iyi nkuru yasangiwe nawe</h1>
                <p id="sharedSubtitle">Turashakisha inkuru...</p>
            </div>
            <div id="sharedFlyerContainer"></div>
            <div class="shared-actions" id="sharedActions" style="display:none;">
                <a href="index.html" class="shared-btn shared-btn-secondary">
                    🏠 Ahabanza
                </a>
                <a href="index.html" id="findMoreBtn" class="shared-btn shared-btn-primary">
                    🔍 Reba izindi nkuru nk'iyi
                </a>
                <button type="button" class="shared-btn shared-btn-copy" onclick="copySharedLink(event)">
                    🔗 Kopiye link
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== SHARED FLYER PAGE LOGIC ====================
        const SUPABASE_URL = 'https://yfqmkbzvsxikopbysrep.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmcW1rYnp2c3hpa29wYnlzcmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjg1ODMsImV4cCI6MjEwNTY0NDU4M30.2egjfNM0UpGjcn5kOFAWBIigTK85bW3icb_thoh0J5Y';
        const CLOUD_API = '/api/flyers';

        const CONTINENT_NAMES = {
            'africa': 'Afurika', 'asia': 'Aziya', 'europe': 'Uburayi',
            'north-america': 'Amerika ya Ruguru', 'south-america': 'Amerika y\'Epfo',
            'australia': 'Ositariya', 'antarctica': 'Antaragitika',
            'cosmic': 'Ikirere', 'worldwide': 'Isi Yose'
        };
        const CONTINENT_ICONS = {
            'africa':'🌍','asia':'🌏','europe':'🌍','north-america':'🌎',
            'south-america':'🌎','cosmic':'🚀','worldwide':'🌐'
        };

        let currentFlyer = null;
        const sessionInteractions = {
            liked: new Set(JSON.parse(localStorage.getItem('wrzkk_shared_liked') || '[]')),
            knew: new Set(JSON.parse(localStorage.getItem('wrzkk_shared_knew') || '[]')),
            didntKnow: new Set(JSON.parse(localStorage.getItem('wrzkk_shared_didntknow') || '[]'))
        };

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t == null ? '' : t;
            return d.innerHTML;
        }

        function persistSession() {
            localStorage.setItem('wrzkk_shared_liked', JSON.stringify([...sessionInteractions.liked]));
            localStorage.setItem('wrzkk_shared_knew', JSON.stringify([...sessionInteractions.knew]));
            localStorage.setItem('wrzkk_shared_didntknow', JSON.stringify([...sessionInteractions.didntKnow]));
        }

        function parseParams() {
            const params = new URLSearchParams(window.location.search);
            return { id: params.get('id') || '' };
        }

        function renderFlyer(flyer) {
            currentFlyer = flyer;
            const id = String(flyer.id);
            const color = flyer.color_class || flyer.colorClass || 'color-1';
            const styleClass = `flyer-style-${flyer.style || 'classic'}`;
            const continent = flyer.continent || 'worldwide';
            const continentLabel = CONTINENT_NAMES[continent] || continent;
            const continentIcon = CONTINENT_ICONS[continent] || '🌍';
            const imageUrl = flyer.image || 'https://images.unsplash.com/photo-1544027993-37dbfe44362b?w=800';

            const liked = sessionInteractions.liked.has(id);
            const knew = sessionInteractions.knew.has(id);
            const didnt = sessionInteractions.didntKnow.has(id);

            document.getElementById('sharedFlyerContainer').innerHTML = `
                <div class="flyer-card ${styleClass} ${color} expanded" style="position:relative;max-width:100%;">
                    <div class="flyer-image">
                        <img class="flyer-image-photo" src="${escapeHtml(imageUrl)}" alt="" loading="eager">
                        <div class="flyer-image-badge">
                            ${continentIcon} ${escapeHtml(continentLabel)}
                        </div>
                    </div>
                    <div class="flyer-content">
                        <h3 class="flyer-title">
                            ${escapeHtml(flyer.title || 'Nta mutwe')}
                        </h3>
                        <div class="flyer-description-full">${escapeHtml(flyer.full_description || flyer.fullDescription || flyer.preview_description || '')}</div>
                        <div class="flyer-metadata"><span>📅 ${escapeHtml(flyer.date || 'Tariki izwi')}</span></div>

                        <<div class="interaction-bar">
                            <button class="interaction-btn ${liked ? 'liked' : ''}" id="btn-like" ${liked ? 'disabled' : ''}>
                                ❤️ <span id="count-likes">${flyer.likes || 0}</span>
                            </button>
                            <button class="interaction-btn" id="btn-comments" disabled>
                                💬 <span>${(flyer.comments || []).length}</span>
                            </button>
                            <button class="interaction-btn ${knew ? 'knew-active' : ''}" id="btn-knew" ${knew ? 'disabled' : ''}>
                                ✅ <span id="count-knew">${flyer.knew || 0}</span>
                            </button>
                            <button class="interaction-btn ${didnt ? 'didntknow-active' : ''}" id="btn-didntknow" ${didnt ? 'disabled' : ''}>
                                ❓ <span id="count-didntknow">${flyer.didnt_know || flyer.didntKnow || 0}</span>
                            </button>
                        </div>

                        ${(flyer.comments || []).length ? `
                            <div class="comments-section">
                                <div class="comment-list">
                                    ${(flyer.comments || []).map(c => `
                                        <div style="padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:0.82rem;">
                                            <strong>${escapeHtml(c.author || 'Uwihitira')}</strong>: ${escapeHtml(c.text || '')}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            // Wire the interaction buttons
            const likeBtn = document.getElementById('btn-like');
            const knewBtn = document.getElementById('btn-knew');
            const didntBtn = document.getElementById('btn-didntknow');

            if (likeBtn && !liked) likeBtn.addEventListener('click', () => handleSharedInteraction('likes'));
            if (knewBtn && !knew) knewBtn.addEventListener('click', () => handleSharedInteraction('knew'));
            if (didntBtn && !didnt) didntBtn.addEventListener('click', () => handleSharedInteraction('didnt_know'));

            // Update "find more like this" link
            const findMore = document.getElementById('findMoreBtn');
            if (findMore) {
                const params = new URLSearchParams();
                if (flyer.category && flyer.category !== 'worldwide') params.set('cat', flyer.category);
                if (flyer.continent && flyer.continent !== 'worldwide') params.set('cont', flyer.continent);
                findMore.href = 'index.html' + (params.toString() ? '?' + params.toString() : '');
            }

            document.getElementById('sharedSubtitle').textContent = 'Iyi nkuru ni iyawe kubona.';
            document.getElementById('sharedActions').style.display = 'flex';
        }

        async function handleSharedInteraction(field) {
            if (!currentFlyer) return;
            const id = String(currentFlyer.id);

            // Enforce the once-per-session rule
            if (field === 'likes' && sessionInteractions.liked.has(id)) return;
            if (field === 'knew' && sessionInteractions.knew.has(id)) return;
            if (field === 'didnt_know' && sessionInteractions.didntKnow.has(id)) return;

            // Optimistic UI update
            const currentVal = field === 'likes' ? (currentFlyer.likes || 0)
                             : field === 'knew' ? (currentFlyer.knew || 0)
                             : (currentFlyer.didnt_know || currentFlyer.didntKnow || 0);
            const newVal = currentVal + 1;

            if (field === 'likes') {
                currentFlyer.likes = newVal;
                document.getElementById('count-likes').textContent = newVal;
                sessionInteractions.liked.add(id);
                document.getElementById('btn-like').disabled = true;
            } else if (field === 'knew') {
                currentFlyer.knew = newVal;
                document.getElementById('count-knew').textContent = newVal;
                sessionInteractions.knew.add(id);
                document.getElementById('btn-knew').disabled = true;
            } else {
                currentFlyer.didnt_know = newVal;
                document.getElementById('count-didntknow').textContent = newVal;
                sessionInteractions.didntKnow.add(id);
                document.getElementById('btn-didntknow').disabled = true;
            }
            persistSession();

            // Send to backend
            try {
                const row = {
                    id: currentFlyer.id,
                    user_id: currentFlyer.user_id || 'system',
                    title: currentFlyer.title || '',
                    preview_description: currentFlyer.preview_description || '',
                    full_description: currentFlyer.full_description || '',
                    image: currentFlyer.image || '',
                    date: currentFlyer.date || '',
                    likes: currentFlyer.likes || 0,
                    comments: currentFlyer.comments || [],
                    knew: currentFlyer.knew || 0,
                    didnt_know: currentFlyer.didnt_know || 0,
                    keywords: currentFlyer.keywords || [],
                    continent: currentFlyer.continent || 'worldwide',
                    category: currentFlyer.category || 'worldwide',
                    region: currentFlyer.region || ''
                };

                const res = await fetch(CLOUD_API, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(row)
                });
                if (!res.ok) {
                    const txt = await res.text();
                    console.warn('Interaction save failed:', res.status, txt);
                } else {
                    console.log('✅ Interaction saved:', field, newVal);
                }
            } catch (err) {
                console.warn('Interaction network error:', err.message);
            }
        }

        function renderError(msg) {
            document.getElementById('sharedFlyerContainer').innerHTML = `
                <div class="shared-error">
                    <h2>😕 Ntibyakunze</h2>
                    <p>${escapeHtml(msg)}</p>
                </div>
            `;
            document.getElementById('sharedActions').style.display = 'flex';
        }

        async function loadFlyer() {
            const { id } = parseParams();
            if (!id) return renderError('Iyi link ntariho flyer.');

            try {
                const res = await fetch(`/api/flyers?id=${encodeURIComponent(id)}`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const live = Array.isArray(data) ? data[0] : data;
                if (live && live.id) {
                    return renderFlyer(live);
                }
            } catch (err) {
                console.warn('Fetch failed:', err.message);
            }
            renderError('Iyi flyer yasibwe cyangwa ntibonetse.');
        }

        async function copySharedLink(event) {
            if (event) event.stopPropagation();
            try {
                await navigator.clipboard.writeText(window.location.href);
                const btn = event?.currentTarget;
                if (btn) {
                    const original = btn.innerHTML;
                    btn.innerHTML = '✅ Byakopiwe!';
                    setTimeout(() => { btn.innerHTML = original; }, 1800);
                }
            } catch (err) {
                alert('Ntibyakunze kopi. Koresha uburyo bwa mudasobwa (Ctrl+C).');
            }
        }

        document.addEventListener('DOMContentLoaded', loadFlyer);
    </script>
</body>
</html>
